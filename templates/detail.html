<!DOCTYPE html>
<html>
<head>
    <title>Detail Edukasi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
    <div class="container">
        <a href="/" class="btn btn-secondary mb-3">Kembali</a>
        <div class="card p-5 shadow">
            <span class="badge bg-info w-25 mb-2">{{ item.kategori }}</span>
            <h1>{{ item.judul }}</h1>
            <hr>
            <p style="white-space: pre-wrap;">{{ item.konten }}</p>
        </div>
    </div>
</body>
</html>
